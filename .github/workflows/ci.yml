name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install frontend dependencies
      run: npm ci

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    # The flat config at the repo root covers backend/src too, so this step
    # lints both apps; the one below re-runs it scoped to the backend.
    - name: Lint frontend
      run: npm run lint

    - name: Lint backend
      run: |
        cd backend
        npm run lint

    # Must precede the backend build — `tsc` reads the generated client's types.
    - name: Generate Prisma client
      run: |
        cd backend
        npm run prisma:generate

    - name: Build frontend
      run: npm run build

    - name: Build backend
      run: |
        cd backend
        npm run build

    - name: Run frontend tests
      run: npm run test

    - name: Run backend tests
      run: |
        cd backend
        npm run test
